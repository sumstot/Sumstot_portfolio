<!doctype html>
<html lang="en" class="scroll-smooth" data-controller="theme">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Soren's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="/stylesheets/site.css" rel="stylesheet" />
    <script src="/javascripts/application.js"></script>
  </head>
  <body data-controller="page clock">

    <nav data-page-target="nav"
         class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-4 transition-all duration-300"
         style="background: var(--bg); border-bottom: 1px solid transparent;">
      <a href="#" class="font-semibold text-lg tracking-tight" style="color: var(--fg);">
        soren<span style="color: var(--em);">.</span>
      </a>
      <div class="flex items-center gap-6">
        <a href="#about"    class="nav-link hidden md:block">About</a>
        <a href="#ramen"    class="nav-link hidden md:block">Ramen</a>
        <a href="#projects" class="nav-link hidden md:block">Projects</a>
        <a href="#contact"  class="nav-link hidden md:block">Contact</a>
        <span class="hidden sm:flex items-center gap-1.5 text-xs font-mono" style="color: var(--muted);">
          <span class="status-dot" style="width:6px;height:6px;"></span>
          <span data-clock-target="display">—:—:— JST</span>
        </span>
        <button data-action="click->theme#toggle"
                data-theme-target="toggleBtn"
                class="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-full border transition-colors"
                style="border-color: var(--border); color: var(--fg);">
          <svg data-theme-target="sunIcon"
               xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
            <path d="M10 2a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 2zM10 15a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 15zM10 7a3 3 0 100 6 3 3 0 000-6zM15.657 5.404a.75.75 0 10-1.06-1.06l-1.061 1.06a.75.75 0 001.06 1.06l1.06-1.06zM6.464 14.596a.75.75 0 10-1.06-1.06l-1.06 1.06a.75.75 0 001.06 1.06l1.06-1.06zM18 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0118 10zM5 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 015 10zM14.596 15.657a.75.75 0 001.06-1.06l-1.06-1.061a.75.75 0 10-1.06 1.06l1.06 1.06zM5.404 6.464a.75.75 0 001.06-1.06L5.404 4.343a.75.75 0 00-1.06 1.06l1.06 1.061z"/>
          </svg>
          <svg data-theme-target="moonIcon"
               xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 hidden">
            <path fill-rule="evenodd" d="M7.455 2.004a.75.75 0 01.26.77 7 7 0 009.958 7.967.75.75 0 011.067.853A8.5 8.5 0 116.647 1.921a.75.75 0 01.808.083z" clip-rule="evenodd"/>
          </svg>
          <span data-theme-target="label" class="hidden sm:inline">Light</span>
        </button>
      </div>
    </nav>

    <main class="pt-16">
      <div data-controller="chatbot"
     data-chatbot-api-url-value="https://portfolio-ai-chatbot-1.onrender.com"
     data-action="click@document->chatbot#handleOutsideClick">

  <!-- Chat panel -->
  <div class="chat-panel"
       data-chatbot-target="panel"
       data-action="click->chatbot#preventClose">

    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 shrink-0"
         style="border-bottom: 1px solid var(--border);">
      <div class="flex items-center gap-2">
        <span class="status-dot"></span>
        <span class="text-sm font-medium" style="color: var(--fg);">Ask me about Soren</span>
      </div>
      <button data-action="click->chatbot#close"
              class="text-lg leading-none transition-colors"
              style="color: var(--muted);">×</button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" data-chatbot-target="messages">
      <div class="msg-bot">
        Hi! I'm Soren's AI assistant. Ask me anything about his projects, skills, or that amazing ramen journey! 🍜
      </div>
    </div>

    <!-- Typing dots -->
    <div class="px-4 py-2 shrink-0 hidden" data-chatbot-target="typingDots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- Input row -->
    <div class="flex gap-2 p-3 shrink-0" style="border-top: 1px solid var(--border);">
      <input type="text"
             data-chatbot-target="input"
             data-action="keydown->chatbot#handleKeydown"
             placeholder="Ask about Soren..."
             maxlength="500"
             class="flex-1 rounded-full px-4 py-2 text-sm outline-none transition-colors"
             style="background: var(--bg); border: 1px solid var(--border); color: var(--fg);">
      <button data-chatbot-target="send"
              data-action="click->chatbot#sendMessage"
              class="btn-em px-4 py-2 text-xs">Send</button>
    </div>

  </div>

  <!-- Floating toggle button -->
  <button data-chatbot-target="toggleBtn"
          data-action="click->chatbot#toggle"
          class="fixed bottom-6 right-6 w-14 h-14 rounded-full flex items-center justify-center text-2xl z-50 shadow-lg transition-transform hover:scale-110"
          style="background: var(--em);">💬</button>

</div>

    </main>

    <footer class="py-8 text-center text-sm border-t" style="border-color: var(--border); color: var(--muted);">
      <p>Built with Ruby · Middleman · Stimulus · Tailwind</p>
      <p class="mt-1">© 2025 Soren Umstot · Osaka, Japan</p>
    </footer>

  </body>
</html>
