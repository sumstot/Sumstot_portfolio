  hero:
    headline: Rails developer in Osaka.
    headline_quiet: I build things and then keep them running.
    lede_html: >-
      %{years} years in Japan, working day to day in Japanese. I develop
      <strong>Kengaku&nbsp;Cloud</strong> at Biz Creation, and outside that I run two
      products of my own — one for Japanese Pension refunds, one
      documenting my %{ramen_years} years of reviewing ramen.
