en:
  meta:
    title: Soren Umstot — Fullstack Rails developer, Osaka
    description: >-
      Rails developer in Osaka. I build production systems solo and keep them
      running — pension claims, payments, and a ramen database with a public API.
  locale_switch: 日本語
  nav:
    work: Work
    how: How I work
    contact: Contact

  hero:
    headline: Rails developer in Osaka.
    headline_quiet: I build things and then keep them running.
    lede_html: >-
      Ten years in Japan, working day to day in Japanese. I develop
      <strong>Kengaku Cloud</strong> at Biz Creation, and outside that I run two
      products of my own — one handling real money and legal filings, one
      documenting eight years of ramen.
    cta: See the work

  work:
    heading: Work
    note: Built solo, deployed by me, still my responsibility at 2am.

  projects:
    mpj:
      title: My Pension Japan
      screenshot_alt: A My Pension Japan claim moving through review and filing
      body: >-
        People leaving Japan are owed their pension contributions back, but the
        application is Japanese-only and the tax portion is legally restricted
        work. My Pension Japan runs the whole claim, routing filings through a
        licensed 社労士 and 税理士. It is live in private beta — three paying
        customers have refunds moving through it, before any marketing.
      built:
        - Stripe checkout with an upfront fee plus commission split
        - Generated pension forms — coordinate-mapped PDF overlays
        - DocuSeal e-signature, staff review queue, full audit log
        - Documents stored in Tokyo for data residency

    portrait:
      alt: Soren Umstot
      caption: Osaka, by way of San Diego

    now:
      title: Off the clock
      subtitle: Outside the editor
      items:
        - label: Studying
          value: Working toward JLPT N1
        - label: Built
          value: A Raspberry Pi e-ink board showing ITM and KIX arrivals
        - label: Dialing in
          value: Light roasts on a Silvia Pro X
        - label: Baking
          value: Shokupan, sourdough, pizza

    ramen:
      title: Ramen Ranger
      body: >-
        Every bowl I've eaten in Kansai since 2018, scored against the same
        rubric, photographed and mapped. It publishes a JSON API — which is what
        fills the row below.
      stats:
        reviews: reviews
        since: hunting since
        stack: Turbo, Google Places, Hetzner
      feed_note: The five most recent, pulled from the API when this page was built.
      feed_link: All %{count} reviews

    kengaku:
      title: Kengaku Cloud
      subtitle: full time
      body: >-
        A cloud platform used by Japanese home builders and real estate firms.
        Feature work and maintenance on a long-lived Rails codebase with a team
        of three, in a fully Japanese-language environment — specs, code review,
        client calls.

    archive:
      title: Earlier work
      subtitle: 2021 — 2022
      body: >-
        Learning projects from my bootcamp years: a Rails chat app on
        ActionCable, a React portfolio calculator, a few Python games. Still on
        GitHub.

  stack:
    heading: How I work
    note: A small stack I understand completely.
    intro: >-
      Rails 8's minimal setup on servers I manage myself. I'd rather own the
      machine and know exactly what's on it than debug a platform I can't SSH
      into. Everything ships with a staging environment that matches production.
    application:
      heading: Application
      items:
        - Ruby on Rails 8
        - Hotwire — Turbo, Stimulus
        - Solid Queue, Cache, Cable
        - SQLite + Litestream, PostgreSQL
        - JavaScript, Python
    infrastructure:
      heading: Infrastructure
      items:
        - Kamal, Docker
        - Vultr, Hetzner
        - Cloudflare CDN and WAF
        - Backblaze B2, AWS S3
        - Litestream backups
    integrations:
      heading: Integrations
      items:
        - Stripe
        - DocuSeal e-signature
        - HexaPDF form generation
        - Google Places and Maps
        - Resend

  contact:
    heading: Got a Rails project that needs finishing?
    body: >-
      Available for consulting on Rails builds, legacy rescue, and getting
      applications deployed on infrastructure you actually control. English or
      日本語.
    github: GitHub
    linkedin: LinkedIn
