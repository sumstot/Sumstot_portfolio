# Tile order and structure. All prose lives in locales/{en,ja}.yml under
# `projects.<id>` so adding a locale never means editing this file.
#
# type: project | portrait | now | ramen | link
# span: columns out of six

- id: mpj
  type: project
  span: 4
  # Two rows tall, so the portrait and "Off the clock" stack in the column beside it.
  row_span: 2
  url: https://mypensionjapan.com
  # Claim dashboard, light theme, seeded data. Crop the file to the shape you
  # want — the tile has no fixed ratio and renders it at its own proportions.
  screenshot: projects/mpj-full.webp
  stack: Rails 8 · Hotwire

- id: portrait
  type: portrait
  span: 2
  image: soren-umstot.jpg

- id: now
  type: now
  span: 2

- id: ramen
  type: ramen
  span: 6
  url: https://theramenranger.com

- id: kengaku
  type: project
  span: 4
  stack: Ruby on Rails · AWS · Heroku · legacy refactoring · 日本語業務

- id: archive
  type: link
  span: 2
  url: https://github.com/sumstot
